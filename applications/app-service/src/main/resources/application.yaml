server:
  port: 8080
spring:
  application:
    name: "ms-authentication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "postgres-authentication"
    port: 5432
    database: "auth_db"
    username: "auth_user"
    password: "auth_pass"
  data:
    r2dbc:
      repositories: null
      enabled: true
spring-doc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger
security:
  jwt:
    issuer: crediya-auth
    expiration-minutes: 120
    kid: rsa-1
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
